[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routeraudit"
version = "0.1.0"
description = "Offline audit planning for quality-constrained LLM model-switch decisions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "jinja2>=3.1",
]

[project.optional-dependencies]
app = ["gradio==5.49.1", "pyarrow>=15"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["routeraudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
